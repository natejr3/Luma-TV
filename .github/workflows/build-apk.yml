name: Build Luma TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore nuviotv.jks \
            -storepass 815787 \
            -keypass 815787 \
            -alias nuviotv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Luma TV, OU=Android TV, O=Luma, L=El Paso, ST=Texas, C=US"

      - name: Build installable TV APK
        run: bash ./gradlew :app:assembleFullDebug --no-daemon --stacktrace

      - name: Prepare universal ARM TV APK
        run: |
          APK=$(find app/build/outputs/apk/full/debug -type f -name '*universal*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found"
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          echo "Using APK: $APK"
          cp "$APK" Luma-TV-Android-TV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Luma-TV-Android-TV-APK
          path: Luma-TV-Android-TV.apk
          if-no-files-found: error
          retention-days: 30
