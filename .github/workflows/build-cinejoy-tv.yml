name: Build CineJoy TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'cinejoy-tv/**'
      - '.github/workflows/build-cinejoy-tv.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build release APK
        run: ./gradlew -p cinejoy-tv :app:assembleRelease --stacktrace

      - name: Validate APK contents
        run: |
          APK=cinejoy-tv/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | tee cinejoy-apk-contents.txt
          unzip -l "$APK" | grep -q 'classes.dex'
          test $(stat -c%s "$APK") -gt 500000

      - name: Prepare APK
        run: cp cinejoy-tv/app/build/outputs/apk/release/app-release.apk CineJoy-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CineJoy-TV
          path: |
            CineJoy-TV.apk
            cinejoy-apk-contents.txt
          if-no-files-found: error
          retention-days: 30

      - name: Replace stable CineJoy release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view cinejoy-tv-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload cinejoy-tv-latest CineJoy-TV.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit cinejoy-tv-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'CineJoy TV 1.1.0' --notes 'TV-focused CineJoy build with enhanced D-pad navigation, modern focus states, resilient loading/error UI, persistent WebView sessions, and a native Media3 player for direct HLS/DASH/MP4 playback.'
          else
            gh release create cinejoy-tv-latest CineJoy-TV.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'CineJoy TV 1.1.0' --notes 'TV-focused CineJoy build with enhanced D-pad navigation, modern focus states, resilient loading/error UI, persistent WebView sessions, and a native Media3 player for direct HLS/DASH/MP4 playback.'
          fi
