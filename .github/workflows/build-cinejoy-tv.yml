name: Build CineJoy TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'cinejoy-tv/**'
      - '.github/workflows/build-cinejoy-tv.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build signed release APK
        run: ./gradlew -p cinejoy-tv :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp cinejoy-tv/app/build/outputs/apk/release/app-release.apk CineJoy-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CineJoy-TV
          path: CineJoy-TV.apk
          if-no-files-found: error
          retention-days: 30

      - name: Replace stable CineJoy release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view cinejoy-tv-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload cinejoy-tv-latest CineJoy-TV.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit cinejoy-tv-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'CineJoy TV 1.0.1' --notes 'Fixed Android/Android TV build with a real launcher activity, WebView playback, fullscreen video, persistent cookies, hardware acceleration, and TV remote support.'
          else
            gh release create cinejoy-tv-latest CineJoy-TV.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'CineJoy TV 1.0.1' --notes 'Fixed Android/Android TV build with a real launcher activity, WebView playback, fullscreen video, persistent cookies, hardware acceleration, and TV remote support.'
          fi
