name: Remove CineJoy Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/remove-cinejoy-release.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete CineJoy release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view cinejoy-tv-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete cinejoy-tv-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
