name: Wire Home Emby Matching

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wire-home-emby.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Home Emby integration
        run: python3 scripts/wire_home_emby.py
      - name: Commit integration
        run: |
          rm -f .github/workflows/wire-home-emby.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Resolve normal Home titles against Emby library'
          git push origin HEAD:main
