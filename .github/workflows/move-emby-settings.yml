name: Move Emby Connect to Settings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-emby-settings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Emby Settings-only navigation
        run: python3 scripts/move_emby_to_settings.py
      - name: Commit navigation cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/move-emby-settings.yml
          git add -A
          git commit -m 'Move Emby connect into Settings only'
          git push origin HEAD:main
